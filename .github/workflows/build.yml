name: Build CloudStream Plugins

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build plugins
        run: ./gradlew make makePluginsJson

      - name: Publish builds branch
        shell: bash
        run: |
          set -e

          mkdir -p /tmp/cloudstream-builds

          cp -f build/plugins.json /tmp/cloudstream-builds/plugins.json

          if [ -f repo.json ]; then
            cp -f repo.json /tmp/cloudstream-builds/repo.json
          fi

          find . -type f -name "*.cs3" -exec cp -f {} /tmp/cloudstream-builds/ \;

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin builds || true

          if git show-ref --verify --quiet refs/remotes/origin/builds; then
            git checkout -B builds origin/builds
          else
            git checkout --orphan builds
            git rm -rf . || true
          fi

          cp -rf /tmp/cloudstream-builds/. .

          git add .

          if git diff --cached --quiet; then
            echo "Nothing to publish."
          else
            git commit -m "Build CloudStream plugins"
            git push origin builds --force
          fi
